name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # public/uploads/Interviews/*.mp4 are LFS-tracked (.gitattributes). Without
          # this the checkout leaves 128-byte pointer files, and the build plus the
          # standalone package guard both pass against them.
          lfs: true

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # 460 cases: the 432-combination quiz parity gate (§8), the lead
        # validation boundary, the rate limiter, and the redirect map §13.3
        # requires be asserted here. This step was missing, so none of them
        # had ever run in CI.
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle budget
        # The root-layout chunk is paid on every route, and nothing was reading
        # the sizes the build prints — which is how 42 KB of chat knowledge base
        # came to be parsed on all 23 routes for a widget that starts closed.
        # Budgets and the rationale for each live in the script.
        run: node tools/check-bundle-budget.mjs

      - name: Standalone package guard
        # Standalone does not copy public/ or .next/static; the pack step is
        # what produces a complete deployable. Assert it works.
        run: node tools/package-standalone.js
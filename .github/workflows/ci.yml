name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # 460 cases: the 432-combination quiz parity gate (§8), the lead
        # validation boundary, the rate limiter, and the redirect map §13.3
        # requires be asserted here. This step was missing, so none of them
        # had ever run in CI.
        run: npm test

      - name: Build
        run: npm run build

      - name: Static artboard sync guard
        # The legacy static site still ships until Phase 15 decommission; the
        # partials must not drift from the shipped artboards.
        run: node tools/sync-partials.js --check

      - name: Standalone package guard
        # Standalone does not copy public/ or .next/static; the pack step is
        # what produces a complete deployable. Assert it works.
        run: node tools/package-standalone.js
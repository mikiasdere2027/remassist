# Rem Assist — nginx, BOOTSTRAP (HTTP only, before a certificate exists).
#
# Deployed to /etc/nginx/sites-available/remassist during provisioning, while
# DNS still points at the old WordPress host. Reachable by IP and by
# `curl --resolve`, which is how the whole cutover gets verified before a
# single DNS record moves.
#
# ISOLATED variant (shared VPS — deploy/provision-isolated.sh): upstream is
# :3002 (the dedicated runbook's :3000 is taken by another app on that box),
# and this is a NAMED vhost only — deliberately NO default_server and no
# catch-all hostname, so unknown-host requests keep hitting the pre-existing
# default site.
#
# Replaced by nginx.conf once certbot has issued, after also changing that
# file's upstream to 127.0.0.1:3002. Do NOT add a redirect to https here:
# there is no certificate yet, so it would redirect into a closed door.

upstream remassist_app {
  server 127.0.0.1:3002;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name remassistance.com www.remassistance.com;

  # Let's Encrypt HTTP-01. Present from the start so Phase 5 can issue without
  # touching this file, and so renewals keep working afterwards.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  include /etc/nginx/snippets/remassist-common.conf;
}

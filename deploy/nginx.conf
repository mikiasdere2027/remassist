# Rem Assist — nginx, PRODUCTION (after certbot has issued).
#
# MIGRATION-PLAN.md §4.5, with three deliberate departures, all noted in
# remassist-common.conf. Deployed to /etc/nginx/sites-available/remassist.
#
# Certificates come from `certbot certonly --webroot`, NOT `--nginx`, so
# certbot never rewrites this file and the copy in the repo stays identical to
# the copy on the box.

# ISOLATED variant (shared VPS — deploy/provision-isolated.sh): the app runs
# on 127.0.0.1:3002 (PORT in shared/.env), NOT :3000 which another app on this
# box owns. The vhost here is a named server only; the certificate files and
# the options-ssl include match a standard certbot webroot issue.

upstream remassist_app {
  server 127.0.0.1:3002;
  # Reused only if the Connection header sent upstream is empty. It was not,
  # until remassist-common.conf was corrected — see the note on `location /`
  # there before changing any proxy_set_header in this stack.
  keepalive 32;
}

# ── OPTIONAL: micro-cache for fully-static HTML ──────────────────────────────
#
# 30 of the 32 routes are prerendered, and every request for one of them
# currently goes through the single Node process. A short proxy_cache takes it
# out of that path entirely: nginx answers from disk and the app sees one
# request per key per interval, which is what keeps a traffic spike from being
# an availability problem on a one-process deployment.
#
# NOT enabled by default, and deliberately not enabled at cutover. A cache in
# front of HTML needs a purge story for deploys, or the first visitors after a
# release get the previous one for as long as the TTL runs. `proxy_cache_path`
# must also live in the http{} block — that is /etc/nginx/nginx.conf, not this
# file, which is a site under sites-available.
#
# To enable, after cutover has settled:
#   1. in /etc/nginx/nginx.conf, inside http{}:
#        proxy_cache_path /var/cache/nginx/remassist levels=1:2
#                         keys_zone=remassist_html:16m max_size=512m
#                         inactive=10m use_temp_path=off;
#   2. in remassist-common.conf, inside `location /`:
#        proxy_cache remassist_html;
#        proxy_cache_key "$scheme$host$request_uri";
#        proxy_cache_valid 200 301 302 60s;
#        proxy_cache_valid 404 10s;
#        # RSC payloads differ from the HTML at the same URL.
#        proxy_cache_bypass $http_rsc;
#        proxy_no_cache $http_rsc;
#        # Never cache a response for a visitor mid-form.
#        proxy_cache_methods GET HEAD;
#        add_header X-Cache-Status $upstream_cache_status always;
#   3. add `rm -rf /var/cache/nginx/remassist/*` to the reload step in
#      deploy/remote-deploy.sh, so a release invalidates rather than waits.

# ── Port 80: ACME, then everything to HTTPS ──────────────────────────────────
# NOT default_server, and no `_` catch-all. This box is shared: the pre-existing
# /etc/nginx/sites-available/default already declares `listen 80 default_server`,
# so a second one fails `nginx -t` with "a duplicate default server for 0.0.0.0:80".
# That turns a reload into a no-op and, worse, makes the next nginx *restart* fail
# outright — taking remconnect down with us. Unknown hosts must keep reaching the
# default site. Same reasoning as the bootstrap vhost.
server {
  listen 80;
  listen [::]:80;
  server_name remassistance.com www.remassistance.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://remassistance.com$request_uri;
  }
}

# ── www → apex ───────────────────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.remassistance.com;

  ssl_certificate     /etc/letsencrypt/live/remassistance.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/remassistance.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # HSTS. Starts deliberately short: max-age=300 is long enough to be a real
  # policy and short enough that a certificate or redirect mistake on cutover
  # day expires by itself instead of locking visitors out for a year. Raise to
  # 31536000 after the day-one check.
  #
  # No `preload`, and no `includeSubDomains` yet. Preload is effectively
  # irreversible — removal from the browser list takes months — and the
  # WordPress rollback window is two weeks. Revisit once that closes.
  add_header Strict-Transport-Security "max-age=300" always;

  return 301 https://remassistance.com$request_uri;
}

# ── The site ─────────────────────────────────────────────────────────────────
server {
  # Also not default_server — see the :80 block. Nothing on this box claims the
  # 443 default today (the default vhost's are commented out), so it would bind;
  # but taking it would silently make remassist the catch-all for every unknown
  # HTTPS host on a box that serves remconnect too. Named hosts only.
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name remassistance.com;

  ssl_certificate     /etc/letsencrypt/live/remassistance.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/remassistance.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # HSTS. Starts deliberately short: max-age=300 is long enough to be a real
  # policy and short enough that a certificate or redirect mistake on cutover
  # day expires by itself instead of locking visitors out for a year. Raise to
  # 31536000 after the day-one check.
  #
  # No `preload`, and no `includeSubDomains` yet. Preload is effectively
  # irreversible — removal from the browser list takes months — and the
  # WordPress rollback window is two weeks. Revisit once that closes.
  add_header Strict-Transport-Security "max-age=300" always;

  include /etc/nginx/snippets/remassist-common.conf;
}

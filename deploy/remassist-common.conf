# Rem Assist — the serving rules, shared by the bootstrap and production
# vhosts so HTTP-phase verification exercises exactly what HTTPS will serve.
#
# Deployed to /etc/nginx/snippets/remassist-common.conf.
#
# Three departures from MIGRATION-PLAN.md §4.5, each deliberate:
#
#  1. /uploads/ is served from disk, not proxied. The interview clips are
#     4–68 MB and every one of them is requested as a byte range by a <video>
#     element. nginx does ranges natively; Node's static handler does them
#     grudgingly, and each in-flight range would otherwise occupy the single
#     app process. The files live in shared/, not in the release, so there is
#     no version-skew risk in serving them outside the app.
#
#  2. /_next/static/ is proxied to Node rather than aliased to
#     current/.next/static. Serving it from disk through the `current` symlink
#     opens a window between the symlink swap and the systemd restart where
#     the old app serves HTML referencing hashes that only exist in the old
#     release — instant 404s on CSS. Proxying keeps markup and assets on the
#     same process at all times. Next already sends
#     `Cache-Control: public, max-age=31536000, immutable` for these, so §4.5's
#     add_header would only have produced a duplicate header.
#
#  3. §4.5's `proxy_cache_valid` is dropped. It is inert without a
#     `proxy_cache_path` / `proxy_cache` pair, which cannot live in a server
#     block, so it never did anything.

gzip on;
gzip_vary on;
# Default is 1, which leaves most of the saving on the table. 6 is roughly the
# knee of the curve for HTML and JS: ~15% smaller than level 1 for a few
# hundred microseconds more CPU on a response that is served once and then sits
# in a browser cache for a year.
gzip_comp_level 6;
# Without this nginx does not compress anything it proxied, because every
# response from the app arrives with a Via header. That is the entire site —
# all HTML, every RSC payload and everything under /_next/static. `any` is
# safe here: the upstream is our own Node process on localhost.
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript
           application/x-javascript text/xml application/xml
           application/xml+rss text/javascript image/svg+xml;
gzip_min_length 1024;
# Video and images are already compressed; gzipping them burns CPU for nothing.

# Brotli, if the module is installed (ngx_brotli is not in Debian's nginx by
# default). ~15-20% better than gzip on text, and browsers that do not send
# `br` in Accept-Encoding fall through to the gzip settings above. Wrapped
# because an unknown directive is a hard config error, not a warning — nginx
# will refuse to start. Uncomment after installing libnginx-mod-brotli and
# confirming `nginx -t` passes.
#brotli on;
#brotli_comp_level 5;
#brotli_types text/plain text/css application/json application/javascript
#             application/x-javascript text/xml application/xml
#             application/xml+rss text/javascript image/svg+xml;

client_max_body_size 12M;   # admin image uploads (§4.5)

# ── Interview video and other uploads: straight off the disk ─────────────────
location ^~ /uploads/ {
  alias /srv/remassist/shared/uploads/;
  add_header X-Content-Type-Options nosniff always;
  add_header Cache-Control "public, max-age=604800" always;
  # Repeated from the server block on purpose: add_header does NOT inherit into
  # a location that declares any add_header of its own, so without this line
  # every /uploads/ response — the interview clips — would be the one part of
  # the site served with no HSTS policy. Keep in step with deploy/nginx.conf.
  add_header Strict-Transport-Security "max-age=300" always;
  # Explicit: <video> depends on this and nginx only advertises it for static
  # files it serves itself.
  add_header Accept-Ranges bytes always;
  access_log off;
  try_files $uri =404;
}

# ── Hashed build assets ─────────────────────────────────────────────────────
location /_next/static/ {
  proxy_pass http://remassist_app;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection "";
  access_log off;
}

location /_next/image {
  proxy_pass http://remassist_app;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection "";
}

# ── The application ─────────────────────────────────────────────────────────
location / {
  proxy_pass http://remassist_app;
  proxy_http_version 1.1;
  # `Connection: upgrade` here was cancelling the `keepalive 32` declared on
  # the upstream in nginx.conf: nginx only reuses a pooled connection when the
  # Connection header it sends upstream is empty, so every HTML document and
  # every RSC payload was opening a fresh TCP connection to the single Node
  # process. This site has no WebSocket route — nothing was being upgraded, the
  # header was copied from the boilerplate — so the empty value that /_next/
  # already uses (see the two blocks above) is the right one everywhere.
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # Without this the app builds http:// callback and canonical URLs behind the
  # proxy. app/api/leads/route.ts also reads X-Real-IP for rate limiting.
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_read_timeout 60s;
}

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="">
  <g font-family="Sora, ui-sans-serif, system-ui, sans-serif">
    <!-- stacked bar: six components of total cost of employment, illustrative only -->
    <g transform="translate(48,64)">
      <rect x="0" y="0" width="544" height="46" rx="10" fill="#ffffff" fill-opacity=".14"/>
      <rect x="0" y="0" width="196" height="46" fill="#ffffff" fill-opacity=".55"/>
      <rect x="196" y="0" width="108" height="46" fill="#ffffff" fill-opacity=".4"/>
      <rect x="304" y="0" width="88" height="46" fill="#ffffff" fill-opacity=".3"/>
      <rect x="392" y="0" width="66" height="46" fill="#ffffff" fill-opacity=".22"/>
      <rect x="458" y="0" width="52" height="46" fill="#ffffff" fill-opacity=".16"/>
      <rect x="510" y="0" width="34" height="46" rx="10" fill="#ffffff" fill-opacity=".1"/>
    </g>

    <!-- legend, two rows of three -->
    <g fill="#ffffff" font-size="14" font-weight="600">
      <g transform="translate(48,150)">
        <rect width="12" height="12" rx="3" fill-opacity=".55"/>
        <text x="20" y="10.5" fill-opacity=".92">Base pay</text>
      </g>
      <g transform="translate(198,150)">
        <rect width="12" height="12" rx="3" fill-opacity=".4"/>
        <text x="20" y="10.5" fill-opacity=".92">Payroll taxes</text>
      </g>
      <g transform="translate(378,150)">
        <rect width="12" height="12" rx="3" fill-opacity=".3"/>
        <text x="20" y="10.5" fill-opacity=".92">Benefits</text>
      </g>
      <g transform="translate(48,182)">
        <rect width="12" height="12" rx="3" fill-opacity=".22"/>
        <text x="20" y="10.5" fill-opacity=".92">Tools &amp; software</text>
      </g>
      <g transform="translate(258,182)">
        <rect width="12" height="12" rx="3" fill-opacity=".16"/>
        <text x="20" y="10.5" fill-opacity=".92">Management time</text>
      </g>
      <g transform="translate(478,182)">
        <rect width="12" height="12" rx="3" fill-opacity=".1"/>
        <text x="20" y="10.5" fill-opacity=".92">Onboarding &amp; ramp</text>
      </g>
    </g>

    <text x="48" y="38" fill="#ffffff" fill-opacity=".85" font-size="13" font-weight="700" letter-spacing="1.2" style="text-transform:uppercase">Six components, one number</text>
  </g>
</svg>
